pipeline:
  # Keep activation shifting + SVDQuant outlier handling.
  shift_activations: true
quant:
  # INT3 weights are aggressive for diffusion; keep activations at INT4.
  # Use a distinct calibration cache folder to avoid clobbering other runs.
  calib:
    data: qdiff_w3a4
    # Calibration cache loader batch size (NOT pipeline batch size).
    batch_size: 8
  enable_smooth: true
  smooth:
    enable_proj: true
    proj:
      objective: OutputsError
      strategy: GridSearch
      granularity: Layer
      spans:
      - - AbsMax
        - AbsMax
      alpha: 0.5
      beta: -2
      num_grids: 20
      allow_low_rank: true
      fuse_when_possible: false
      skips:
      - embed
      - resblock_shortcut
      - resblock_time_proj
      - transformer_proj_in
      - transformer_proj_out
      - transformer_norm
      - transformer_add_norm
      - attn_add
      - ffn_add
      - down_sample
      - up_sample
  wgts:
    dtype: sint3
    group_shapes:
    - - 1
      - 32
      - 1
      - 1
      - 1
    scale_dtypes:
    - null
    enable_low_rank: true
    low_rank:
      rank: 32
      early_stop: true
      degree: 2
      objective: OutputsError
      num_iters: 100
      skips:
      - embed
      - resblock_shortcut
      - resblock_time_proj
      - transformer_proj_in
      - transformer_proj_out
      - transformer_norm
      - transformer_add_norm
      - attn_add
      - ffn_add
      - down_sample
      - up_sample
  ipts:
    static: false
    dtype: sint4
    group_shapes:
    - - 1
      - 32
      - 1
      - 1
      - 1
    scale_dtypes:
    - null
    allow_unsigned: true
