pipeline:
  # Keep activation shifting + SVDQuant outlier handling.
  shift_activations: true
quant:
  # FLUX has very large sequence length (txt+img tokens) and MLP dims; keep calib batches small to avoid OOM.
  calib:
    batch_size: 1
  # INT3 weights are extremely aggressive for diffusion; keep activations at INT4.
  enable_smooth: true
  smooth:
    enable_proj: true
    proj:
      objective: OutputsError
      strategy: GridSearch
      granularity: Layer
      # Smaller batch/size to reduce PTQ GPU peak memory on FLUX.
      sample_batch_size: 1
      sample_size: 8
      spans:
      - - AbsMax
        - AbsMax
      alpha: 0.5
      beta: -2
      num_grids: 20
      allow_low_rank: true
      fuse_when_possible: false
      skips:
      - embed
      - resblock
      - transformer_proj_in
      - transformer_proj_out
      - transformer_norm
      - transformer_add_norm
      - down_sample
      - up_sample
  wgts:
    dtype: sint3
    group_shapes:
    - - 1
      - 64
      - 1
      - 1
      - 1
    scale_dtypes:
    - null
    enable_low_rank: true
    low_rank:
      rank: 32
      early_stop: true
      degree: 2
      objective: OutputsError
      # Smaller batch/size to reduce PTQ GPU peak memory on FLUX.
      sample_batch_size: 1
      sample_size: 8
      num_iters: 100
      skips:
      - embed
      - resblock
      - transformer_proj_in
      - transformer_proj_out
      - transformer_norm
      - transformer_add_norm
      - down_sample
      - up_sample
  ipts:
    static: false
    dtype: sint4
    group_shapes:
    - - 1
      - 64
      - 1
      - 1
      - 1
    scale_dtypes:
    - null
    allow_unsigned: true
